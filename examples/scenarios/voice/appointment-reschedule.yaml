name: Appointment reschedule
description: "A caller moves an existing appointment: the agent asks for a day, offers two slots, and confirms the new time."
channel: voice
agentId: agt_local
numberId: num_local
from: "+15559876547"
to: "+15551234567"
conversationState:
  customerName: "Grace O'Neill"
  tier: gold
  appointment: "2026-09-18T14:00"
contextLimit: 10
timeoutSeconds: 30
turns:
  - caller: "Hi, I need to move my appointment to a different day."
    expect:
      actions: [request_reschedule_day]
      forbiddenActions: [request_confirmation_code]
  - caller: "Thursday would be better for me."
    expect:
      actions: [offer_slots]
      replyMatches: "Thursday"
  - caller: "The afternoon one, 2 PM."
    expect:
      actions: [reschedule_confirmed]
      replyMatches: "Thursday at 2:00 PM"
  - caller: "Perfect, thanks."
    expect:
      actions: [hangup]
