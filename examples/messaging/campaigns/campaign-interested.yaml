name: Campaign reply — interested
description: "A fall-promo opener sent outside the webhook; the customer replies YES within the offer window and gets a promo code."
channel: imessage
agentId: agt_local
numberId: num_local
from: "+15559876544"
to: "+15551234567"
conversationState:
  customerName: Jordan Reyes
  tier: standard
contextLimit: 10
timeoutSeconds: 30
turns:
  - agent: "Hi Jordan, it's North Lot EV Charging. Fall tune-up special: 20% off any service booked this week. Reply YES to claim, or STOP to opt out."
  - caller: "YES"
    after: 2h
    expect:
      actions:
        - issue_promo_code
      replyMatches: "FALL20"
  - caller: "Thanks!"
    expect:
      actions:
        - campaign_closed
