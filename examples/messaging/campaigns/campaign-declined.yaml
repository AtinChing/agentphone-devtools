name: Campaign reply — not interested
description: "A polite decline must close the thread without further selling or opting the customer out of everything."
channel: sms
agentId: agt_local
numberId: num_local
from: "+15559876544"
to: "+15551234567"
conversationState:
  customerName: Jordan Reyes
  tier: standard
contextLimit: 10
timeoutSeconds: 30
turns:
  - agent: "Hi Jordan, it's North Lot EV Charging. Fall tune-up special: 20% off any service booked this week. Reply YES to claim, or STOP to opt out."
  - caller: "No thanks, not right now."
    after: 40m
    expect:
      actions:
        - campaign_declined
      forbiddenActions:
        - issue_promo_code
        - opt_out
