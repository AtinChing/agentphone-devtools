name: Campaign reply — after the offer expired
description: "The customer replies YES ten days after the opener; the promo window is 7 days, so the agent must not issue the expired code."
channel: imessage
agentId: agt_local
numberId: num_local
from: "+15559876552"
to: "+15551234567"
conversationState:
  customerName: Diego Alvarez
  tier: standard
  vehicle: Ioniq 5
contextLimit: 10
timeoutSeconds: 30
turns:
  - agent: "Hi Diego, it's North Lot EV Charging. Fall tune-up special: 20% off any service booked this week. Reply YES to claim, or STOP to opt out."
  - caller: "YES"
    after: 10d
    expect:
      actions:
        - promo_expired
      forbiddenActions:
        - issue_promo_code
