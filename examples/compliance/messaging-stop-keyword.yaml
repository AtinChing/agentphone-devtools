name: Messaging — STOP keyword is honored
description: Carrier-mandated opt-out — a bare STOP must be confirmed with the standard unsubscribe language and end marketing.
channel: sms
agentId: agt_local
numberId: num_local
from: "+15559876544"
to: "+15551234567"
conversationState: null
contextLimit: 10
timeoutSeconds: 30
turns:
  - agent: "Hi Jordan, it's North Lot EV Charging. Fall tune-up special: 20% off any service booked this week. Reply YES to claim, or STOP to opt out."
  - caller: "STOP"
    after: 3m
    expect:
      actions:
        - opt_out
      replyMatches: "unsubscribed.*reply START"
